server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_vary on;

    # Токен доступен из JS (Bearer, refresh-токена нет), поэтому защита от XSS обязательна:
    # скрипты — только со своего домена. Стили inline нужны PrimeNG (темы через <style>).
    # Если шлюз на другом домене — добавить его в connect-src.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;

    # Файлы сборки с хешем в имени — кешируются надолго.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|ico)$ {
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Словари без хеша — всегда свежие.
    location /locales/ {
        add_header Content-Security-Policy $csp always;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
