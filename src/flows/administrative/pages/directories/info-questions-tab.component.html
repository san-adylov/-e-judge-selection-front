<div class="mb-4 flex flex-wrap items-center gap-3">
  <p class="m-0 flex-1 text-sm text-surface-500">{{ 'staff-directories.questions.hint' | lang }}</p>
  <p-button icon="pi pi-plus" [label]="'staff-directories.questions.create-action' | lang" (onClick)="open(null)" />
</div>

<div class="flex max-w-4xl flex-col gap-2">
  @if (loading()) {
    @for (row of [1, 2, 3]; track row) {
      <p-skeleton height="3.5rem" borderRadius="0.75rem" />
    }
  } @else {
    @for (item of items(); track item.id; let i = $index) {
      <article class="flex flex-wrap items-center gap-3 rounded-xl border border-surface-200 bg-surface-0 px-4 py-2">
        <span class="w-6 text-sm text-surface-500">{{ item.sortOrder ?? i + 1 }}.</span>
        <span class="min-w-0 flex-1 break-words" [class.text-surface-400]="item.active === false">{{
          text(item)
        }}</span>
        <p-tag
          [severity]="item.active === false ? 'secondary' : 'success'"
          [value]="(item.active === false ? 'staff-directories.inactive' : 'staff-directories.active') | lang"
        />
        <p-button
          icon="pi pi-pencil"
          severity="secondary"
          [text]="true"
          [ariaLabel]="'shell.actions.edit' | lang"
          (onClick)="open(item)"
        />
        <p-button
          [icon]="item.active === false ? 'pi pi-eye' : 'pi pi-eye-slash'"
          severity="secondary"
          [text]="true"
          [ariaLabel]="(item.active === false ? 'staff-directories.activate' : 'staff-directories.deactivate') | lang"
          [loading]="busy() === item.id"
          (onClick)="toggle(item)"
        />
      </article>
    } @empty {
      <div class="rounded-xl border border-surface-200 bg-surface-0 p-8 text-center text-surface-500">
        {{ 'staff-directories.questions.empty' | lang }}
      </div>
    }
  }
</div>

<p-dialog
  styleClass="w-full max-w-xl mx-4"
  [modal]="true"
  [header]="(selected() ? 'staff-directories.questions.edit-title' : 'staff-directories.questions.create-title') | lang"
  [visible]="editing()"
  (visibleChange)="editing.set($event)"
>
  <form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="submit()">
    <app-form-field
      label="staff-directories.questions.text-ru"
      inputId="aq-ru"
      [required]="true"
      [control]="form.controls.textRu"
    >
      <textarea pTextarea id="aq-ru" class="w-full" rows="2" [autoResize]="true" formControlName="textRu"></textarea>
    </app-form-field>
    <app-form-field label="staff-directories.questions.text-kg" inputId="aq-kg" [control]="form.controls.textKg">
      <textarea pTextarea id="aq-kg" class="w-full" rows="2" [autoResize]="true" formControlName="textKg"></textarea>
    </app-form-field>
    <div class="grid grid-cols-2 items-end gap-4">
      <app-form-field label="staff-directories.items.sort-order" inputId="aq-sort" [control]="form.controls.sortOrder">
        <p-inputnumber
          inputId="aq-sort"
          styleClass="w-full"
          [min]="0"
          [useGrouping]="false"
          formControlName="sortOrder"
        />
      </app-form-field>
      <div class="flex items-center gap-2 pb-2">
        <p-checkbox inputId="aq-active" [binary]="true" formControlName="active" />
        <label for="aq-active" class="text-sm font-medium">{{ 'staff-directories.active' | lang }}</label>
      </div>
    </div>
    <div class="flex flex-wrap justify-end gap-2">
      <p-button
        severity="secondary"
        [text]="true"
        [label]="'shell.actions.cancel' | lang"
        (onClick)="editing.set(false)"
      />
      <p-button type="submit" icon="pi pi-save" [label]="'shell.actions.save' | lang" [loading]="saving()" />
    </div>
  </form>
</p-dialog>
