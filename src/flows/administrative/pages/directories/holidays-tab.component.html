<div class="mb-4 flex flex-wrap items-center gap-3">
  <p class="m-0 flex-1 text-sm text-surface-500">{{ 'staff-directories.holidays.hint' | lang }}</p>
  <p-button icon="pi pi-plus" [label]="'staff-directories.holidays.create-action' | lang" (onClick)="open(null)" />
</div>

<div class="flex max-w-4xl flex-col gap-2">
  @if (loading()) {
    @for (row of [1, 2, 3]; track row) {
      <p-skeleton height="3.25rem" borderRadius="0.75rem" />
    }
  } @else {
    @for (item of items(); track item.id) {
      <article class="flex flex-wrap items-center gap-3 rounded-xl border border-surface-200 bg-surface-0 px-4 py-2">
        <span class="w-24 tabular-nums">{{ item.date | localDate }}</span>
        <span class="min-w-0 flex-1 truncate font-medium">{{ name(item) }}</span>
        @if (item.recurring) {
          <p-tag severity="info" [value]="'staff-directories.holidays.recurring' | lang" />
        }
        <p-button
          icon="pi pi-pencil"
          severity="secondary"
          [text]="true"
          [ariaLabel]="'shell.actions.edit' | lang"
          (onClick)="open(item)"
        />
        <p-button
          icon="pi pi-trash"
          severity="danger"
          [text]="true"
          [ariaLabel]="'shell.actions.delete' | lang"
          [loading]="busy() === item.id"
          (onClick)="remove(item)"
        />
      </article>
    } @empty {
      <div class="rounded-xl border border-surface-200 bg-surface-0 p-8 text-center text-surface-500">
        {{ 'staff-directories.holidays.empty' | lang }}
      </div>
    }
  }
</div>

<p-dialog
  styleClass="w-full max-w-lg mx-4"
  [modal]="true"
  [header]="(selected() ? 'staff-directories.holidays.edit-title' : 'staff-directories.holidays.create-title') | lang"
  [visible]="editing()"
  (visibleChange)="editing.set($event)"
>
  <form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="submit()">
    <app-form-field
      label="staff-directories.holidays.date"
      inputId="holiday-date"
      [required]="true"
      [control]="form.controls.date"
    >
      <p-datepicker
        inputId="holiday-date"
        dateFormat="dd.mm.yy"
        appendTo="body"
        styleClass="w-full"
        [showIcon]="true"
        formControlName="date"
      />
    </app-form-field>
    <app-form-field
      label="staff-directories.holidays.name-ru"
      inputId="holiday-ru"
      [required]="true"
      [control]="form.controls.nameRu"
    >
      <input pInputText id="holiday-ru" class="w-full" formControlName="nameRu" />
    </app-form-field>
    <app-form-field label="staff-directories.holidays.name-kg" inputId="holiday-kg" [control]="form.controls.nameKg">
      <input pInputText id="holiday-kg" class="w-full" formControlName="nameKg" />
    </app-form-field>
    <div class="flex items-center gap-2">
      <p-checkbox inputId="holiday-recurring" [binary]="true" formControlName="recurring" />
      <label for="holiday-recurring" class="text-sm font-medium">{{
        'staff-directories.holidays.recurring' | lang
      }}</label>
    </div>
    <div class="flex flex-wrap justify-end gap-2">
      <p-button
        severity="secondary"
        [text]="true"
        [label]="'shell.actions.cancel' | lang"
        (onClick)="editing.set(false)"
      />
      <p-button type="submit" icon="pi pi-save" [label]="'shell.actions.save' | lang" [loading]="saving()" />
    </div>
  </form>
</p-dialog>
